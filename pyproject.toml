[project]
name = "mining-potential"
version = "0.1.0"
description = "EARTH 5014 Option D: machine-learning mineral potential mapping in Northern Ireland from Tellus data"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
